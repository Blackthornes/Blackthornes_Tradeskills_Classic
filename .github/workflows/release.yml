name: Release

# Publishing is driven by tags. Push a tag like v0.2.0 and this checks the
# changelog has a section for it, runs the tests, builds the player-facing zip,
# checks the zip is clear to post, and only then uploads it to whichever sites
# have a token configured. A site with no token (or no project ID in the TOC)
# is skipped, so this workflow is safe to merge before any account is linked.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads the tags to name the version, so it needs the
          # history rather than a shallow clone.
          fetch-depth: 0

      - name: The changelog says what this version is
        run: python tools/check_release.py "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip lupa

      - name: Syntax check
        run: python tools/syntaxcheck.py

      - name: Lint calls
        run: python tools/lintcalls.py

      - name: Tests
        run: python tools/runtests.py

      - name: Package tests
        run: |
          python tools/test_check_release.py
          python tools/test_make_whatsnew.py
          python tools/test_check_package.py
          python tools/test_announce_discord.py
          python tools/test_post_general.py

      # Build first with nothing uploaded, so the package can be checked
      # before anything leaves the repository.
      - name: Build the package, without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z

      # House rule: "always check that it's clear to post." A failure here stops
      # the release before any upload, and the log says what it found.
      - name: Check the package is clear to post
        run: python tools/check_package.py .release/Blackthornes_TS

      # -c -o zip and upload the folder that was just checked, as it is,
      # rather than building a fresh copy.
      - name: Upload the checked package
        uses: BigWigsMods/packager@v2
        with:
          args: -c -o
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}

      # Tells the Discord server: posts this version's changelog in
      # #announcements. Needs the DISCORD_WEBHOOK_URL repository secret, which
      # the owner sets himself; without it this step does nothing. A failure
      # here shows as a warning and never undoes the upload above.
      # This one release (v0.10.1) is quiet: no Discord posts. The next tag posts as usual.
      - name: Announce on Discord
        if: github.ref_name != 'v0.10.1'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tools/announce_discord.py "${{ github.ref_name }}"

      # Tells the players: posts this version's NEWS.md section, a few short
      # bullets under the addon's name, which points to #announcements, with
      # the thanks at the end (no link, no card), in #general. Needs the
      # DISCORD_GENERAL_WEBHOOK_URL repository secret, which the owner sets
      # himself; without it, or without a NEWS.md section, this step does
      # nothing. The post gets the clear-to-post scan first. A failure here
      # shows as a warning and never undoes the upload above.
      # This one release (v0.10.1) is quiet: no Discord posts. The next tag posts as usual.
      - name: "Post the news in #general"
        if: github.ref_name != 'v0.10.1'
        continue-on-error: true
        env:
          DISCORD_GENERAL_WEBHOOK_URL: ${{ secrets.DISCORD_GENERAL_WEBHOOK_URL }}
        run: python tools/post_general.py "${{ github.ref_name }}"
